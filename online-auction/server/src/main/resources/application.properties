spring.application.name=online-auction-server
server.port=8080

spring.datasource.url=${AUCTION_DB_URL:jdbc:mysql://localhost:3306/online_auction?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${AUCTION_DB_USER:root}
spring.datasource.password=${AUCTION_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Chỉ dùng khi phát triển local; không bật trên production.
logging.level.vn.edu.auction=INFO
